name: Download unDraw illustrations

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Run downloader
        run: python scripts/download_undraw.py

      - name: Zip results
        if: always()
        run: |
          if [ -d undraw_svgs ]; then zip -qr undraw_svgs.zip undraw_svgs; fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: undraw-illustrations
          path: |
            undraw_svgs.zip
            debug_page1.html
          if-no-files-found: ignore
          retention-days: 7
